<!DOCTYPE html>
<html>
<head>
    <title>A11y Checker</title>
    <style>
        body { font-family: Arial; background: #f0f0f0; padding: 2rem; }
        .card { background: white; border-radius: 20px; padding: 2rem; max-width: 600px; margin: auto; }
        input, button { padding: 10px; margin: 5px; width: 80%; }
    </style>
</head>
<body>
<div class="card">
    <h1>♿ Web A11y Checker</h1>
    <form method="post">
        <input type="url" name="url" placeholder="https://yandex.ru" required>
        <button type="submit">Проверить</button>
    </form>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
</div>
</body>
</html>
